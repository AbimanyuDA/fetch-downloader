name: MediaFetch
options:
  bundleIdPrefix: com.mediafetch
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    COMBINE_HIDPI_IMAGES: YES
    ENABLE_HARDENED_RUNTIME: YES

targets:
  MediaFetch:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "**/*.md"
      - path: Resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.mediafetch.app
      INFOPLIST_FILE: Resources/Info.plist
      CODE_SIGN_ENTITLEMENTS: Resources/MediaFetch.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: NO

  MediaFetchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MediaFetchTests
    dependencies:
      - target: MediaFetch
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.mediafetch.tests
      GENERATE_INFOPLIST_FILE: YES
